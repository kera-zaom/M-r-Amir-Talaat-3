<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#050507">

<title>الخوارزمي | إضافة اختبار</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    min-height:100%;
}

body{

    font-family:
        "Cairo",
        "Tajawal",
        Arial,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(105,70,220,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 0%,
            #302052,
            #15121e 30%,
            #07070a 65%,
            #000
        );

    min-height:100vh;
}


/* =========================
   BACKGROUND
========================= */

.background{

    position:fixed;
    inset:0;
    z-index:-5;

    overflow:hidden;

    pointer-events:none;
}

.background::before{

    content:"";

    position:absolute;

    width:600px;
    height:600px;

    top:-300px;
    right:-200px;

    border-radius:50%;

    background:#7448e8;

    filter:blur(170px);

    opacity:.20;
}

.background::after{

    content:"";

    position:absolute;

    width:550px;
    height:550px;

    bottom:-300px;
    left:-200px;

    border-radius:50%;

    background:#3154df;

    filter:blur(180px);

    opacity:.14;
}

.stars{

    position:absolute;
    inset:0;

    opacity:.07;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1px
        );

    background-size:90px 90px;

    animation:
        starsMove
        18s linear infinite;
}


/* =========================
   NAVBAR
========================= */

.navbar{

    width:100%;

    padding:18px 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(5,5,8,.55);

    backdrop-filter:blur(20px);
}

.brand{

    display:flex;

    align-items:center;

    gap:12px;
}

.brand-icon{

    width:48px;
    height:48px;

    border-radius:15px;

    overflow:hidden;

    border:
        1px solid
        rgba(180,155,255,.35);

    box-shadow:
        0 10px 35px
        rgba(119,76,255,.35);

    background:#24134d;
}

.brand-icon img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.brand-name{

    font-size:18px;

    font-weight:1000;
}

.brand-sub{

    color:#8e8c9d;

    font-size:10px;

    margin-top:4px;
}

.back-button{

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.045);

    color:#ccc;

    padding:11px 16px;

    border-radius:13px;

    font-family:inherit;

    font-weight:800;

    cursor:pointer;

    transition:.25s;
}

.back-button:hover{

    background:
        rgba(137,98,255,.15);

    border-color:
        rgba(150,120,255,.35);

    color:#fff;
}


/* =========================
   MAIN
========================= */

.main{

    width:100%;

    max-width:850px;

    margin:auto;

    padding:
        55px 20px 80px;
}


/* =========================
   HEADER
========================= */

.page-header{

    text-align:center;

    margin-bottom:35px;
}

.page-badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        9px 16px;

    border-radius:50px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#aaa8ba;

    font-size:12px;

    margin-bottom:18px;
}

.page-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#926cff;

    box-shadow:
        0 0 15px #926cff;
}

.page-header h1{

    font-size:
        clamp(30px,5vw,48px);

    font-weight:1000;

    margin-bottom:10px;
}

.page-header h1 span{

    background:
        linear-gradient(
            135deg,
            #fff,
            #c9baff,
            #7953e5
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.page-header p{

    color:#9694a5;

    font-size:13px;

    line-height:2;
}


/* =========================
   CARD
========================= */

.form-card{

    position:relative;

    padding:32px;

    border-radius:27px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.30);

    backdrop-filter:blur(20px);

    overflow:hidden;
}

.form-card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-100px;
    right:-70px;

    border-radius:50%;

    background:#7953e5;

    filter:blur(70px);

    opacity:.17;
}


/* =========================
   FORM
========================= */

.form-group{

    position:relative;

    margin-bottom:22px;
}

.form-group label{

    display:block;

    margin-bottom:9px;

    color:#d2d0dd;

    font-size:13px;

    font-weight:900;
}

.form-group label span{

    color:#8962ff;
}

.input,
.textarea{

    width:100%;

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        rgba(0,0,0,.24);

    color:#fff;

    border-radius:15px;

    padding:
        15px 16px;

    font-family:inherit;

    font-size:13px;

    outline:none;

    transition:
        border-color .25s,
        box-shadow .25s,
        background .25s;
}

.input::placeholder,
.textarea::placeholder{

    color:#656474;
}

.input:focus,
.textarea:focus{

    border-color:
        rgba(137,98,255,.65);

    background:
        rgba(30,20,55,.35);

    box-shadow:
        0 0 0 3px
        rgba(137,98,255,.09),

        0 0 25px
        rgba(137,98,255,.08);
}

.textarea{

    min-height:130px;

    resize:vertical;

    line-height:1.9;
}


/* =========================
   TWO COLUMNS
========================= */

.form-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:16px;
}


/* =========================
   PUBLISH
========================= */

.publish-box{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    padding:18px;

    border-radius:17px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.07);

    margin-top:5px;

    margin-bottom:25px;
}

.publish-info{

    display:flex;

    flex-direction:column;

    gap:5px;
}

.publish-title{

    font-size:13px;

    font-weight:900;
}

.publish-desc{

    color:#777585;

    font-size:10px;
}


/* =========================
   SWITCH
========================= */

.switch{

    position:relative;

    width:55px;
    height:30px;

    flex-shrink:0;
}

.switch input{

    opacity:0;

    width:0;
    height:0;
}

.slider{

    position:absolute;

    inset:0;

    cursor:pointer;

    border-radius:50px;

    background:#292733;

    border:
        1px solid
        rgba(255,255,255,.10);

    transition:.3s;
}

.slider::before{

    content:"";

    position:absolute;

    width:22px;
    height:22px;

    right:4px;
    top:3px;

    border-radius:50%;

    background:#8c8999;

    transition:.3s;
}

.switch input:checked + .slider{

    background:
        linear-gradient(
            135deg,
            #8962ff,
            #4d2bac
        );

    box-shadow:
        0 0 20px
        rgba(137,98,255,.30);
}

.switch input:checked + .slider::before{

    transform:
        translateX(-25px);

    background:#fff;
}


/* =========================
   BUTTON
========================= */

.save-button{

    width:100%;

    border:0;

    border-radius:16px;

    padding:16px;

    color:#fff;

    font-family:inherit;

    font-size:15px;

    font-weight:1000;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #8962ff,
            #4d2bac
        );

    box-shadow:
        0 15px 40px
        rgba(105,68,240,.30);

    transition:.25s;
}

.save-button:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 20px 50px
        rgba(105,68,240,.45);
}

.save-button:active{

    transform:scale(.98);
}

.save-button:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* =========================
   MESSAGE
========================= */

.message{

    display:none;

    margin-bottom:20px;

    padding:15px;

    border-radius:14px;

    font-size:12px;

    line-height:1.8;
}

.message.success{

    display:block;

    color:#b9f5cf;

    background:
        rgba(50,200,100,.07);

    border:
        1px solid
        rgba(50,200,100,.18);
}

.message.error{

    display:block;

    color:#ffb7c4;

    background:
        rgba(255,70,100,.07);

    border:
        1px solid
        rgba(255,70,100,.18);
}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    color:#5f5e6d;

    font-size:10px;

    padding:
        10px 0 30px;
}


/* =========================
   ANIMATION
========================= */

@keyframes starsMove{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-90px,-90px);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .navbar{

        padding:15px;
    }

    .brand-icon{

        width:42px;
        height:42px;

        border-radius:13px;
    }

    .brand-name{

        font-size:16px;
    }

    .brand-sub{

        font-size:9px;
    }

    .back-button{

        padding:
            9px 12px;

        font-size:11px;
    }

    .main{

        padding:
            35px 15px 60px;
    }

    .form-card{

        padding:21px;

        border-radius:22px;
    }

    .form-row{

        grid-template-columns:1fr;
    }

    .publish-box{

        align-items:flex-start;
    }

}

</style>

</head>


<body>


<div class="background">

    <div class="stars"></div>

</div>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="brand">

        <div class="brand-icon">

            <img
                src="../teacher.png"
                alt="المستر"
                draggable="false"
            >

        </div>

        <div>

            <div class="brand-name">
                الخوارزمي
            </div>

            <div class="brand-sub">
                لوحة تحكم المستر
            </div>

        </div>

    </div>


    <button
        id="backButton"
        class="back-button"
        type="button"
    >
        ← لوحة التحكم
    </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="main">


    <div class="page-header">

        <div class="page-badge">

            <span class="page-dot"></span>

            إدارة الاختبارات

        </div>


        <h1>

            إنشاء
            <span>اختبار جديد</span>

        </h1>


        <p>

            أضف بيانات الاختبار ثم احفظه
            ليظهر لك لإضافة الأسئلة.

        </p>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <section class="form-card">


        <!-- TITLE -->

        <div class="form-group">

            <label>
                اسم الاختبار
                <span>*</span>
            </label>

            <input
                id="title"
                class="input"
                type="text"
                placeholder="مثال: اختبار الوحدة الأولى"
                autocomplete="off"
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label>
                وصف الاختبار
            </label>

            <textarea
                id="description"
                class="textarea"
                placeholder="اكتب وصفاً مختصراً للاختبار..."
            ></textarea>

        </div>


        <!-- DURATION -->

        <div class="form-row">

            <div class="form-group">

                <label>
                    مدة الاختبار بالدقائق
                    <span>*</span>
                </label>

                <input
                    id="duration"
                    class="input"
                    type="number"
                    min="1"
                    max="600"
                    value="30"
                    placeholder="30"
                >

            </div>


            <div class="form-group">

                <label>
                    حالة الاختبار
                </label>

                <div class="publish-box">

                    <div class="publish-info">

                        <div class="publish-title">
                            نشر الاختبار
                        </div>

                        <div class="publish-desc">
                            سيظهر للطلاب عند التفعيل
                        </div>

                    </div>


                    <label class="switch">

                        <input
                            id="published"
                            type="checkbox"
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </div>


        <!-- SAVE -->

        <button
            id="saveButton"
            class="save-button"
            type="button"
        >

            💾 حفظ الاختبار

        </button>


    </section>


</main>


<footer class="footer">

    © 2026 الخوارزمي | منصة الاختبارات

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mqwtrsbncanwtxotxppp.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_lPAYrGCg_7-5Y1Dj7E5BSw_o-DsYl9Z";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const titleInput =
    document.getElementById("title");

const descriptionInput =
    document.getElementById("description");

const durationInput =
    document.getElementById("duration");

const publishedInput =
    document.getElementById("published");

const saveButton =
    document.getElementById("saveButton");

const message =
    document.getElementById("message");

const backButton =
    document.getElementById("backButton");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================================
   BACK
===================================================== */

backButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "index.html";

    }
);


/* =====================================================
   SAVE
===================================================== */

let saving = false;


saveButton.addEventListener(
    "click",
    async function(){

        if(saving){

            return;

        }


        const title =
            titleInput.value.trim();


        const description =
            descriptionInput.value.trim();


        const duration =
            Number(
                durationInput.value
            );


        const isPublished =
            publishedInput.checked;


        /* =====================
           VALIDATION
        ===================== */

        if(!title){

            showMessage(
                "اكتب اسم الاختبار أولاً.",
                "error"
            );

            titleInput.focus();

            return;

        }


        if(
            !Number.isFinite(duration) ||
            duration < 1
        ){

            showMessage(
                "اكتب مدة صحيحة للاختبار.",
                "error"
            );

            durationInput.focus();

            return;

        }


        saving = true;

        saveButton.disabled =
            true;

        saveButton.textContent =
            "⏳ جاري حفظ الاختبار...";


        try{

            /* =====================
               CURRENT USER
            ===================== */

            const {
                data: userData,
                error: userError
            } =
            await supabaseClient.auth.getUser();


            if(userError){

                throw userError;

            }


            const user =
                userData.user;


            if(!user){

                showMessage(
                    "يجب تسجيل الدخول أولاً.",
                    "error"
                );

                setTimeout(
                    function(){

                        window.location.href =
                            "../auth.html";

                    },
                    1200
                );

                return;

            }


            /* =====================
               INSERT EXAM
            ===================== */

            const {
                data,
                error
            } =
            await supabaseClient
                .from("exams")
                .insert({

                    title:
                        title,

                    description:
                        description || null,

                    duration_minutes:
                        duration,

                    is_published:
                        isPublished,

                    created_by:
                        user.id

                })
                .select()
                .single();


            if(error){

                throw error;

            }


            /* =====================
               SUCCESS
            ===================== */

            showMessage(
                "✅ تم إنشاء الاختبار بنجاح.",
                "success"
            );


            saveButton.textContent =
                "✅ تم حفظ الاختبار";


            /*
              بعد إنشاء الاختبار
              ننتقل لإضافة الأسئلة.
            */

            setTimeout(
                function(){

                    window.location.href =
                        "questions.html?exam_id=" +
                        encodeURIComponent(
                            data.id
                        );

                },
                900
            );


        }
        catch(error){

            console.error(
                "Create exam error:",
                error
            );


            let text =
                "حدث خطأ أثناء إنشاء الاختبار.";


            if(
                error?.code ===
                "42501"
            ){

                text =
                    "ليس لديك صلاحية إضافة اختبار. راجع صلاحيات RLS في Supabase.";

            }
            else if(
                error?.message
            ){

                text =
                    error.message;

            }


            showMessage(
                text,
                "error"
            );


            saving = false;

            saveButton.disabled =
                false;

            saveButton.textContent =
                "💾 حفظ الاختبار";

        }

    }
);

</script>

</body>

</html>
