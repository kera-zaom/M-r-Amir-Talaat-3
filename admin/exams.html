<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#050507">

<title>الخوارزمي | إدارة الاختبارات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:
        "Cairo",
        "Tajawal",
        Arial,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(105,70,220,.15),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 0%,
            #302052 0%,
            #15121e 30%,
            #07070a 65%,
            #000 100%
        );

    min-height:100vh;

    overflow-x:hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background{

    position:fixed;

    inset:0;

    z-index:-10;

    pointer-events:none;

    overflow:hidden;
}

.background::before{

    content:"";

    position:absolute;

    width:620px;
    height:620px;

    top:-320px;
    right:-190px;

    border-radius:50%;

    background:#7448e8;

    filter:blur(170px);

    opacity:.20;
}

.background::after{

    content:"";

    position:absolute;

    width:580px;
    height:580px;

    bottom:-330px;
    left:-220px;

    border-radius:50%;

    background:#3154df;

    filter:blur(180px);

    opacity:.13;
}

.stars{

    position:absolute;

    inset:0;

    opacity:.07;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1px
        );

    background-size:90px 90px;

    animation:
        starsMove
        18s
        linear
        infinite;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{

    width:100%;

    padding:
        18px 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:relative;

    z-index:20;

    background:
        rgba(5,5,8,.58);

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    backdrop-filter:blur(20px);
}


/* =====================================================
   BRAND
===================================================== */

.brand{

    display:flex;

    align-items:center;

    gap:12px;
}

.brand-icon{

    width:48px;
    height:48px;

    border-radius:15px;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #855cff,
            #3c2389
        );

    border:
        1px solid
        rgba(180,155,255,.35);

    box-shadow:

        0 12px 35px
        rgba(119,76,255,.30),

        0 0 25px
        rgba(119,76,255,.18);
}

.brand-icon img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.brand-info{

    display:flex;

    flex-direction:column;

    line-height:1.2;
}

.brand-name{

    font-size:18px;

    font-weight:1000;
}

.brand-sub{

    margin-top:4px;

    color:#8f8d9e;

    font-size:10px;
}


/* =====================================================
   NAV BUTTONS
===================================================== */

.nav-actions{

    display:flex;

    align-items:center;

    gap:10px;
}

.nav-button{

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.045);

    color:#d1cedf;

    padding:
        10px 15px;

    border-radius:13px;

    font-family:inherit;

    font-size:12px;

    font-weight:900;

    cursor:pointer;

    transition:.25s;
}

.nav-button:hover{

    background:
        rgba(137,98,255,.16);

    border-color:
        rgba(150,120,255,.35);

    color:#fff;
}

.nav-button.primary{

    background:
        linear-gradient(
            135deg,
            #8962ff,
            #4d2bac
        );

    border-color:
        transparent;

    color:#fff;

    box-shadow:
        0 10px 30px
        rgba(105,68,240,.25);
}

.nav-button.primary:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 38px
        rgba(105,68,240,.40);
}


/* =====================================================
   MAIN
===================================================== */

.main{

    width:100%;

    max-width:1250px;

    margin:auto;

    padding:
        45px 5% 70px;
}


/* =====================================================
   PAGE HEADER
===================================================== */

.page-header{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:25px;

    margin-bottom:30px;

    animation:
        contentIn
        .7s
        ease
        both;
}

.page-title{

    min-width:0;
}

.page-badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        8px 14px;

    border-radius:50px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#aaa8ba;

    font-size:11px;

    margin-bottom:14px;
}

.page-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#926cff;

    box-shadow:
        0 0 15px #926cff;
}

.page-title h1{

    font-size:
        clamp(
            32px,
            5vw,
            54px
        );

    line-height:1.2;

    font-weight:1000;

    margin-bottom:8px;
}

.page-title h1 span{

    background:
        linear-gradient(
            135deg,
            #fff,
            #c9baff,
            #7953e5
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.page-title p{

    color:#92909f;

    font-size:13px;

    line-height:1.9;
}


/* =====================================================
   TOP ACTION
===================================================== */

.add-button{

    flex-shrink:0;

    border:0;

    border-radius:16px;

    padding:
        15px 21px;

    background:
        linear-gradient(
            135deg,
            #8962ff,
            #4d2bac
        );

    color:#fff;

    font-family:inherit;

    font-size:13px;

    font-weight:1000;

    cursor:pointer;

    box-shadow:
        0 15px 40px
        rgba(105,68,240,.28);

    transition:.25s;
}

.add-button:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 20px 48px
        rgba(105,68,240,.42);
}


/* =====================================================
   STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;
}

.stat-card{

    padding:20px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(16px);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.20);
}

.stat-label{

    color:#898797;

    font-size:11px;

    margin-bottom:9px;
}

.stat-number{

    font-size:27px;

    font-weight:1000;

    color:#fff;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;

    padding:15px;

    border-radius:18px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.06);

    backdrop-filter:blur(15px);
}

.search-box{

    flex:1;

    position:relative;
}

.search-box input{

    width:100%;

    height:46px;

    padding:
        0 45px 0 15px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:
        rgba(0,0,0,.20);

    color:#fff;

    font-family:inherit;

    font-size:12px;

    transition:.25s;
}

.search-box input:focus{

    border-color:
        rgba(143,108,255,.45);

    box-shadow:
        0 0 25px
        rgba(115,75,230,.10);
}

.search-icon{

    position:absolute;

    right:15px;

    top:50%;

    transform:
        translateY(-50%);

    color:#777487;

    pointer-events:none;
}

.filter-select{

    height:46px;

    min-width:145px;

    padding:
        0 13px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:
        #15131d;

    color:#c8c5d5;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;
}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    display:none;

    padding:16px 18px;

    margin-bottom:20px;

    border-radius:15px;

    background:
        rgba(255,65,95,.06);

    border:
        1px solid
        rgba(255,80,110,.16);

    color:#e2aab7;

    font-size:12px;

    line-height:1.8;
}


/* =====================================================
   SUCCESS
===================================================== */

.success-box{

    display:none;

    padding:16px 18px;

    margin-bottom:20px;

    border-radius:15px;

    background:
        rgba(80,220,150,.06);

    border:
        1px solid
        rgba(80,220,150,.16);

    color:#a8e7c8;

    font-size:12px;

    line-height:1.8;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:
        70px 20px;

    color:#858394;

    font-size:12px;
}

.loader{

    width:36px;
    height:36px;

    margin:
        0 auto 15px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.07);

    border-top-color:
        #8962ff;

    animation:
        spin
        .8s
        linear
        infinite;
}


/* =====================================================
   EXAMS GRID
===================================================== */

.exams-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(300px,1fr)
        );

    gap:20px;
}


/* =====================================================
   EXAM CARD
===================================================== */

.exam-card{

    position:relative;

    overflow:hidden;

    padding:23px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.25);

    backdrop-filter:blur(18px);

    animation:
        cardIn
        .5s
        ease
        both;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.exam-card::before{

    content:"";

    position:absolute;

    width:140px;
    height:140px;

    top:-80px;
    right:-55px;

    border-radius:50%;

    background:#7953e5;

    filter:blur(55px);

    opacity:.16;

    pointer-events:none;
}

.exam-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(145,108,255,.32);

    box-shadow:
        0 28px 70px
        rgba(65,35,150,.23);
}


/* =====================================================
   CARD TOP
===================================================== */

.card-top{

    position:relative;

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}

.exam-icon{

    width:53px;
    height:53px;

    border-radius:16px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    background:
        linear-gradient(
            135deg,
            rgba(137,98,255,.30),
            rgba(77,43,172,.18)
        );

    border:
        1px solid
        rgba(150,120,255,.20);

    font-size:23px;
}

.status{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        7px 10px;

    border-radius:10px;

    font-size:9px;

    font-weight:900;
}

.status.published{

    color:#9ee8c1;

    background:
        rgba(70,220,145,.07);

    border:
        1px solid
        rgba(70,220,145,.13);
}

.status.draft{

    color:#d1c3a4;

    background:
        rgba(220,175,80,.07);

    border:
        1px solid
        rgba(220,175,80,.13);
}

.status-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 10px currentColor;
}


/* =====================================================
   CARD CONTENT
===================================================== */

.exam-card h3{

    font-size:19px;

    font-weight:1000;

    margin-bottom:8px;

    word-break:break-word;
}

.exam-description{

    color:#8f8d9c;

    font-size:11px;

    line-height:1.9;

    min-height:42px;

    margin-bottom:17px;

    word-break:break-word;
}


/* =====================================================
   INFO
===================================================== */

.exam-info{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:20px;
}

.info{

    padding:
        7px 10px;

    border-radius:9px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.06);

    color:#a3a1b0;

    font-size:9px;
}


/* =====================================================
   ACTIONS
===================================================== */

.card-actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.card-button{

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:12px;

    padding:
        11px 8px;

    background:
        rgba(255,255,255,.045);

    color:#c7c4d3;

    font-family:inherit;

    font-size:10px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.card-button:hover{

    background:
        rgba(137,98,255,.13);

    border-color:
        rgba(145,108,255,.25);

    color:#fff;
}

.card-button.publish{

    color:#a9e8c6;
}

.card-button.unpublish{

    color:#d7c795;
}

.card-button.delete{

    color:#e7a8b4;
}

.card-button.delete:hover{

    background:
        rgba(255,70,95,.10);

    border-color:
        rgba(255,80,100,.22);
}

.card-button:disabled{

    opacity:.45;

    cursor:not-allowed;

    transform:none;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    display:none;

    text-align:center;

    padding:
        70px 20px;

    border-radius:23px;

    background:
        rgba(255,255,255,.035);

    border:
        1px dashed
        rgba(255,255,255,.10);
}

.empty-icon{

    font-size:46px;

    margin-bottom:14px;

    opacity:.75;
}

.empty h3{

    font-size:19px;

    margin-bottom:8px;
}

.empty p{

    color:#81808f;

    font-size:11px;

    line-height:1.9;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    color:#5f5e6d;

    font-size:10px;

    padding:
        15px 0 30px;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

@keyframes starsMove{

    from{
        transform:
            translate(0,0);
    }

    to{
        transform:
            translate(-90px,-90px);
    }
}

@keyframes contentIn{

    from{
        opacity:0;
        transform:
            translateY(25px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(20px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .navbar{

        padding:
            15px;
    }

    .brand-icon{

        width:42px;
        height:42px;

        border-radius:13px;
    }

    .brand-name{

        font-size:15px;
    }

    .brand-sub{

        font-size:8px;
    }

    .nav-button{

        padding:
            9px 10px;

        font-size:10px;
    }

    .main{

        padding:
            32px 15px 55px;
    }

    .page-header{

        align-items:stretch;

        flex-direction:column;
    }

    .add-button{

        width:100%;
    }

    .stats{

        grid-template-columns:
            1fr;

        gap:10px;
    }

    .toolbar{

        flex-direction:column;

        align-items:stretch;
    }

    .filter-select{

        width:100%;
    }

    .exams-grid{

        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="stars"></div>

</div>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <div class="brand">

        <div class="brand-icon">

            <img
                src="../teacher.png"
                alt="المستر"
                draggable="false"
            >

        </div>

        <div class="brand-info">

            <div class="brand-name">
                الخوارزمي
            </div>

            <div class="brand-sub">
                إدارة الاختبارات
            </div>

        </div>

    </div>


    <div class="nav-actions">

        <button
            id="dashboardButton"
            class="nav-button"
            type="button"
        >
            لوحة التحكم
        </button>

        <button
            id="logoutButton"
            class="nav-button"
            type="button"
        >
            خروج
        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- PAGE HEADER -->

    <section class="page-header">

        <div class="page-title">

            <div class="page-badge">

                <span class="page-dot"></span>

                لوحة إدارة الاختبارات

            </div>

            <h1>

                إدارة
                <span>الاختبارات</span>

            </h1>

            <p>

                أنشئ اختباراتك، راجعها،
                وانشرها للطلاب من مكان واحد.

            </p>

        </div>


        <button
            id="addExamButton"
            class="add-button"
            type="button"
        >

            ＋ إنشاء اختبار جديد

        </button>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">
                إجمالي الاختبارات
            </div>

            <div
                id="totalCount"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                الاختبارات المنشورة
            </div>

            <div
                id="publishedCount"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                المسودات
            </div>

            <div
                id="draftCount"
                class="stat-number"
            >
                0
            </div>

        </div>

    </section>


    <!-- MESSAGES -->

    <div
        id="errorBox"
        class="error-box"
    ></div>

    <div
        id="successBox"
        class="success-box"
    ></div>


    <!-- TOOLBAR -->

    <section class="toolbar">

        <div class="search-box">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="ابحث باسم الاختبار..."
                autocomplete="off"
            >

        </div>


        <select
            id="filterSelect"
            class="filter-select"
        >

            <option value="all">
                كل الاختبارات
            </option>

            <option value="published">
                المنشورة فقط
            </option>

            <option value="draft">
                المسودات فقط
            </option>

        </select>

    </section>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loader"></div>

        جاري تحميل الاختبارات...

    </div>


    <!-- EXAMS -->

    <section
        id="examsGrid"
        class="exams-grid"
    ></section>


    <!-- EMPTY -->

    <div
        id="empty"
        class="empty"
    >

        <div class="empty-icon">
            📝
        </div>

        <h3>
            لا توجد اختبارات
        </h3>

        <p>
            أنشئ أول اختبار لك وسيظهر هنا.
        </p>

    </div>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    © 2026 الخوارزمي | منصة الاختبارات

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mqwtrsbncanwtxotxppp.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_lPAYrGCg_7-5Y1Dj7E5BSw_o-DsYl9Z";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const examsGrid =
    document.getElementById(
        "examsGrid"
    );

const empty =
    document.getElementById(
        "empty"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const filterSelect =
    document.getElementById(
        "filterSelect"
    );

const totalCount =
    document.getElementById(
        "totalCount"
    );

const publishedCount =
    document.getElementById(
        "publishedCount"
    );

const draftCount =
    document.getElementById(
        "draftCount"
    );

const addExamButton =
    document.getElementById(
        "addExamButton"
    );

const dashboardButton =
    document.getElementById(
        "dashboardButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* =====================================================
   STATE
===================================================== */

let exams = [];

let loadingExams = false;

let operationInProgress = false;


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;


function clearMessages(){

    errorBox.style.display =
        "none";

    successBox.style.display =
        "none";

    errorBox.textContent =
        "";

    successBox.textContent =
        "";

}


function showError(message){

    if(messageTimer){

        clearTimeout(
            messageTimer
        );

    }

    successBox.style.display =
        "none";

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

    messageTimer =
        setTimeout(
            function(){

                errorBox.style.display =
                    "none";

            },
            5000
        );

}


function showSuccess(message){

    if(messageTimer){

        clearTimeout(
            messageTimer
        );

    }

    errorBox.style.display =
        "none";

    successBox.textContent =
        message;

    successBox.style.display =
        "block";

    messageTimer =
        setTimeout(
            function(){

                successBox.style.display =
                    "none";

            },
            3500
        );

}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if(error){

        throw error;

    }


    const user =
        data.user;


    if(!user){

        window.location.replace(
            "../auth.html"
        );

        return null;

    }


    /*
       نتحقق من role داخل profiles.
    */

    const {
        data:profile,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,full_name,email,role,is_active"
        )
        .eq(
            "id",
            user.id
        )
        .maybeSingle();


    if(profileError){

        throw profileError;

    }


    if(!profile){

        showError(
            "لم يتم العثور على ملف الحساب داخل profiles."
        );

        return null;

    }


    if(
        profile.role !== "admin"
    ){

        showError(
            "ليس لديك صلاحية الدخول إلى إدارة الاختبارات."
        );

        setTimeout(
            function(){

                window.location.replace(
                    "../student/index.html"
                );

            },
            1500
        );

        return null;

    }


    if(
        profile.is_active === false
    ){

        showError(
            "هذا الحساب غير نشط."
        );

        return null;

    }


    return user;

}


/* =====================================================
   LOAD EXAMS
===================================================== */

async function loadExams(){

    if(loadingExams){

        return;

    }


    loadingExams = true;


    loading.style.display =
        "block";

    empty.style.display =
        "none";

    examsGrid.innerHTML =
        "";


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("exams")
            .select(
                "id,title,description,duration_minutes,is_published,created_by,created_at,updated_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        exams =
            data || [];


        await loadQuestionCounts();


        updateStats();

        renderExams();


    }
    catch(error){

        console.error(
            "Load exams error:",
            error
        );

        showError(
            "تعذر تحميل الاختبارات: " +
            (
                error.message ||
                "خطأ غير معروف"
            )
        );

    }
    finally{

        loadingExams = false;

        loading.style.display =
            "none";

    }

}


/* =====================================================
   LOAD QUESTION COUNTS
===================================================== */

async function loadQuestionCounts(){

    if(
        !exams ||
        exams.length === 0
    ){

        return;

    }


    const ids =
        exams.map(
            exam => exam.id
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("questions")
        .select(
            "id,exam_id"
        )
        .in(
            "exam_id",
            ids
        );


    if(error){

        /*
           لو RLS منع قراءة الأسئلة
           لا نوقف صفحة الاختبارات.
        */

        console.warn(
            "Question count unavailable:",
            error.message
        );

        exams.forEach(
            exam => {

                exam.question_count =
                    0;

            }
        );

        return;

    }


    const counts = {};


    (data || []).forEach(
        function(question){

            const id =
                question.exam_id;

            counts[id] =
                (
                    counts[id] ||
                    0
                ) + 1;

        }
    );


    exams.forEach(
        function(exam){

            exam.question_count =
                counts[exam.id] ||
                0;

        }
    );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const total =
        exams.length;


    const published =
        exams.filter(
            exam =>
                exam.is_published === true
        ).length;


    const draft =
        total - published;


    totalCount.textContent =
        total;

    publishedCount.textContent =
        published;

    draftCount.textContent =
        draft;

}


/* =====================================================
   RENDER
===================================================== */

function renderExams(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filter =
        filterSelect.value;


    const filtered =
        exams.filter(
            function(exam){

                const title =
                    String(
                        exam.title || ""
                    ).toLowerCase();


                const description =
                    String(
                        exam.description || ""
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    title.includes(search) ||
                    description.includes(search);


                let matchesFilter =
                    true;


                if(
                    filter === "published"
                ){

                    matchesFilter =
                        exam.is_published === true;

                }


                if(
                    filter === "draft"
                ){

                    matchesFilter =
                        exam.is_published !== true;

                }


                return (
                    matchesSearch &&
                    matchesFilter
                );

            }
        );


    examsGrid.innerHTML =
        "";


    if(
        filtered.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        function(exam,index){

            examsGrid.appendChild(
                createExamCard(
                    exam,
                    index
                )
            );

        }
    );

}


/* =====================================================
   CREATE CARD
===================================================== */

function createExamCard(
    exam,
    index
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "exam-card";


    card.style.animationDelay =
        (
            index * 0.05
        ) +
        "s";


    const title =
        exam.title ||
        "اختبار بدون اسم";


    const description =
        exam.description ||
        "لا يوجد وصف لهذا الاختبار.";


    const duration =
        exam.duration_minutes ??
        0;


    const questions =
        exam.question_count ??
        0;


    const published =
        exam.is_published === true;


    const statusClass =
        published
            ? "published"
            : "draft";


    const statusText =
        published
            ? "منشور"
            : "مسودة";


    const toggleText =
        published
            ? "🔒 إلغاء النشر"
            : "🚀 نشر الاختبار";


    const toggleClass =
        published
            ? "unpublish"
            : "publish";


    card.innerHTML = `

        <div class="card-top">

            <div class="exam-icon">
                📝
            </div>

            <div class="status ${statusClass}">

                <span class="status-dot"></span>

                ${statusText}

            </div>

        </div>


        <h3>
            ${escapeHTML(title)}
        </h3>


        <p class="exam-description">
            ${escapeHTML(description)}
        </p>


        <div class="exam-info">

            <span class="info">
                ⏱️ ${escapeHTML(duration)} دقيقة
            </span>

            <span class="info">
                ❓ ${questions} سؤال
            </span>

            <span class="info">
                📅 ${formatDate(exam.created_at)}
            </span>

        </div>


        <div class="card-actions">

            <button
                class="card-button"
                data-action="questions"
                type="button"
            >
                ❓ الأسئلة
            </button>


            <button
                class="card-button"
                data-action="edit"
                type="button"
            >
                ✏️ تعديل
            </button>


            <button
                class="card-button ${toggleClass}"
                data-action="toggle"
                type="button"
            >
                ${toggleText}
            </button>


            <button
                class="card-button delete"
                data-action="delete"
                type="button"
            >
                🗑️ حذف
            </button>

        </div>

    `;


    const buttons =
        card.querySelectorAll(
            ".card-button"
        );


    buttons.forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const action =
                        button.dataset.action;


                    if(
                        action === "questions"
                    ){

                        openQuestions(
                            exam.id
                        );

                    }


                    if(
                        action === "edit"
                    ){

                        editExam(
                            exam.id
                        );

                    }


                    if(
                        action === "toggle"
                    ){

                        togglePublish(
                            exam.id,
                            !published
                        );

                    }


                    if(
                        action === "delete"
                    ){

                        deleteExam(
                            exam.id
                        );

                    }

                }
            );

        }
    );


    return card;

}

        );

}


/* =====================================================
   TOGGLE PUBLISH
===================================================== */

async function togglePublish(
    examId,
    publish
){

    if(operationInProgress){

        return;

    }


    const exam =
        exams.find(
            item =>
                item.id === examId
        );


    if(!exam){

        return;

    }


    const actionText =
        publish
            ? "نشر"
            : "إلغاء نشر";


    const confirmed =
        confirm(
            "هل تريد " +
            actionText +
            " هذا الاختبار؟"
        );


    if(!confirmed){

        return;

    }


    operationInProgress =
        true;


    try{

        const {
            error
        } =
        await supabaseClient
            .from("exams")
            .update({

                is_published:
                    publish,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                examId
            );


        if(error){

            throw error;

        }


        exam.is_published =
            publish;


        updateStats();

        renderExams();


        showSuccess(
            publish
                ? "تم نشر الاختبار بنجاح."
                : "تم إلغاء نشر الاختبار."
        );


    }
    catch(error){

        console.error(
            "Publish error:",
            error
        );

        showError(
            "تعذر تحديث حالة الاختبار: " +
            (
                error.message ||
                "خطأ غير معروف"
            )
        );

    }
    finally{

        operationInProgress =
            false;

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteExam(
    examId
){

    if(operationInProgress){

        return;

    }


    const exam =
        exams.find(
            item =>
                item.id === examId
        );


    if(!exam){

        return;

    }


    const confirmed =
        confirm(
            "⚠️ هل أنت متأكد من حذف الاختبار؟\n\n" +
            "اسم الاختبار: " +
            (
                exam.title ||
                "بدون اسم"
            ) +
            "\n\n" +
            "سيتم حذف الاختبار من جدول exams."
        );


    if(!confirmed){

        return;

    }


    operationInProgress =
        true;


    try{

        /*
           نحاول حذف الأسئلة أولاً.
           ده مهم لو فيه Foreign Key
           يمنع حذف الاختبار.
        */

        const {
            error:questionsError
        } =
        await supabaseClient
            .from("questions")
            .delete()
            .eq(
                "exam_id",
                examId
            );


        if(
            questionsError
        ){

            /*
               لا نكمل حذف الاختبار
               إذا فشل حذف الأسئلة،
               حتى لا تكون النتيجة غير متوقعة.
            */

            throw questionsError;

        }


        const {
            error
        } =
        await supabaseClient
            .from("exams")
            .delete()
            .eq(
                "id",
                examId
            );


        if(error){

            throw error;

        }


        exams =
            exams.filter(
                item =>
                    item.id !== examId
            );


        updateStats();

        renderExams();


        showSuccess(
            "تم حذف الاختبار بنجاح."
        );


    }
    catch(error){

        console.error(
            "Delete error:",
            error
        );

        showError(
            "تعذر حذف الاختبار: " +
            (
                error.message ||
                "تأكد من صلاحيات RLS في Supabase."
            )
        );

    }
    finally{

        operationInProgress =
            false;

    }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    value
){

    if(!value){

        return "غير محدد";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "غير محدد";

    }


    return date.toLocaleDateString(
        "ar-EG",
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(value ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

/* =====================================================
   LOGOUT
===================================================== */

let loggingOut = false;


logoutButton.addEventListener(
    "click",
    async function(){

        if(loggingOut){

            return;

        }


        const confirmed =
            confirm(
                "هل تريد تسجيل الخروج؟"
            );


        if(!confirmed){

            return;

        }


        loggingOut = true;

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "جاري الخروج...";


        try{

            const {
                error
            } =
            await supabaseClient
                .auth
                .signOut();


            if(error){

                throw error;

            }


            window.location.replace(
                "../auth.html"
            );

        }
        catch(error){

            console.error(
                error
            );

            loggingOut = false;

            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "خروج";

            showError(
                "تعذر تسجيل الخروج."
            );

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

let initialized = false;


async function init(){

    if(initialized){

        return;

    }


    initialized = true;


    try{

        const user =
            await checkAdmin();


        if(!user){

            return;

        }


        await loadExams();

    }
    catch(error){

        console.error(
            "Initialization error:",
            error
        );

        showError(
            "حدث خطأ أثناء فتح لوحة الاختبارات: " +
            (
                error.message ||
                "خطأ غير معروف"
            )
        );

    }

}


init();
